<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1621">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Нормикс</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232aabee'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='system-ui' font-weight='800'%3EН%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1621;--elev:#17212b;--bubble:#182533;--bubble-own:#2b5278;
  --accent:#2aabee;--text:#fff;--muted:#7d8b99;--dim:#5a6a7a;
  --border:rgba(255,255,255,0.06);--green:#4fd1a5;--red:#ef5c5c;--yellow:#f0c419;
  --purple:#a855f7;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none;font-size:15px}
button,input,textarea{font-family:inherit;color:inherit}
#app{height:100vh;height:100dvh;display:grid;grid-template-columns:340px 1fr;overflow:hidden}
#offlineBar{display:none;background:var(--red);color:#fff;text-align:center;
  font-size:12px;font-weight:600;padding:6px;padding-top:calc(6px + env(safe-area-inset-top))}
#offlineBar.on{display:block}

/* SIDEBAR */
#sidebar{background:var(--elev);display:flex;flex-direction:column;
  border-right:1px solid var(--border);min-height:0}
#sbHead{padding:14px 16px;display:flex;align-items:center;gap:8px;
  padding-top:calc(14px + env(safe-area-inset-top));
  border-bottom:1px solid var(--border)}
#logo{font-size:22px;font-weight:800;color:var(--accent);flex:1;letter-spacing:-0.02em}
.ib{width:38px;height:38px;border-radius:50%;border:none;background:transparent;
  color:var(--muted);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:.15s;font-size:20px;flex-shrink:0}
.ib:hover{background:rgba(255,255,255,0.06);color:var(--text)}
#search{padding:8px 12px}
#searchInput{width:100%;padding:9px 14px;border-radius:10px;
  background:rgba(255,255,255,0.05);border:1px solid transparent;
  color:var(--text);font-size:14px;outline:none}
#searchInput::placeholder{color:var(--dim)}
#searchInput:focus{background:rgba(255,255,255,0.08);border-color:rgba(42,171,238,0.3)}
#chatsList{flex:1;overflow-y:auto;overscroll-behavior:contain}
#chatsList::-webkit-scrollbar{width:4px}
#chatsList::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}
.chatItem{display:flex;align-items:center;gap:12px;padding:10px 16px;
  cursor:pointer;transition:background .12s;border:none;background:transparent;
  width:100%;text-align:left;color:inherit;font-size:inherit}
.chatItem:hover{background:rgba(255,255,255,0.03)}
.chatItem.active{background:rgba(42,171,238,0.12)}
.chatItem.active .chatName{color:var(--accent)}
.avatar{width:54px;height:54px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;font-size:20px;
  background:linear-gradient(135deg,#2aabee,#239be0);position:relative}
.avatar.ai{background:linear-gradient(135deg,#a855f7,#7c3aed)}
.avatar.online::after{content:'';position:absolute;bottom:1px;right:1px;
  width:13px;height:13px;border-radius:50%;background:var(--green);
  border:2px solid var(--elev)}
.chatInfo{flex:1;min-width:0}
.chatTop{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:3px}
.chatName{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;transition:color .12s}
.chatTime{font-size:12px;color:var(--dim);flex-shrink:0}
.chatBottom{display:flex;justify-content:space-between;align-items:center;gap:6px}
.chatPreview{font-size:13.5px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:1}
.badge{min-width:20px;height:20px;padding:0 7px;border-radius:10px;
  background:var(--accent);color:#fff;font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* MAIN */
#main{display:flex;flex-direction:column;background:var(--bg);min-height:0;position:relative}
#emptyState{flex:1;display:flex;align-items:center;justify-content:center;
  flex-direction:column;color:var(--dim);text-align:center;padding:20px}
#emptyState .emIcon{font-size:64px;margin-bottom:16px;opacity:.3}
#emptyState .emTitle{font-size:16px;font-weight:600;color:var(--muted);margin-bottom:6px}
#emptyState .emText{font-size:13.5px}
#chatView{display:none;flex-direction:column;height:100%}
#chatView.on{display:flex}
#chatHead{padding:10px 16px;background:var(--elev);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top));flex-shrink:0}
#backBtn{display:none;width:38px;height:38px;border-radius:50%;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  align-items:center;justify-content:center;font-size:22px}
#backBtn:hover{background:rgba(255,255,255,0.06);color:var(--text)}
#chatHeadInfo{flex:1;min-width:0}
#chatHeadName{font-weight:600;font-size:15px;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatHeadStatus{font-size:12.5px;color:var(--accent)}

/* SHARE */
#shareBanner{background:linear-gradient(135deg,rgba(42,171,238,0.15),rgba(35,155,224,0.08));
  border-bottom:1px solid rgba(42,171,238,0.2);padding:12px 16px;display:none}
#shareBanner.on{display:block}
#shareBanner .sbTitle{font-size:12px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:6px;font-weight:600}
#shareBanner .sbCode{display:flex;gap:8px;align-items:center}
#shareBanner .sbCodeText{flex:1;padding:10px 14px;background:rgba(0,0,0,0.3);
  border-radius:10px;font-family:'SF Mono',Menlo,Consolas,monospace;
  font-size:16px;font-weight:600;color:var(--accent);letter-spacing:.08em;
  text-align:center;user-select:all}
#shareBanner .sbCopy{padding:10px 16px;border-radius:10px;border:none;
  background:var(--accent);color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;flex-shrink:0}

#messages{flex:1;overflow-y:auto;padding:12px 16px 8px;
  display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
.dateSep{align-self:center;font-size:12px;color:var(--muted);
  background:rgba(0,0,0,0.3);padding:3px 12px;border-radius:12px;
  margin:10px 0 6px;font-weight:500}
.msgWrap{display:flex;max-width:75%;margin-bottom:2px}
.msgWrap.own{align-self:flex-end}
.msgWrap.other{align-self:flex-start}
.msgWrap.first{margin-top:6px}
.msg{padding:7px 12px 8px;border-radius:14px;font-size:14.5px;
  line-height:1.35;word-wrap:break-word;animation:msgIn .18s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msgWrap.own .msg{background:var(--bubble-own);border-bottom-right-radius:5px}
.msgWrap.other .msg{background:var(--bubble);border-bottom-left-radius:5px}
.msgWrap:not(.first).own .msg{border-top-right-radius:5px}
.msgWrap:not(.first).other .msg{border-top-left-radius:5px}
.msgSender{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:3px}
.msgText{white-space:pre-wrap;word-break:break-word}
.msgMeta{display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;color:rgba(255,255,255,0.5);margin-left:8px;
  vertical-align:bottom;line-height:1;float:right;margin-top:6px}
.msgWrap.other .msgMeta{color:var(--dim)}
#messagesEmpty{flex:1;display:flex;align-items:center;justify-content:center;
  flex-direction:column;color:var(--dim);font-size:14px;text-align:center;padding:40px}
.typing{color:var(--muted);font-style:italic;font-size:13px;padding:0 16px 4px;height:18px}

#inputWrap{padding:8px 12px;background:var(--elev);
  border-top:1px solid var(--border);
  padding-bottom:calc(8px + env(safe-area-inset-bottom))}
#inputRow{display:flex;align-items:flex-end;gap:8px}
#msgInput{flex:1;padding:10px 16px;border-radius:20px;
  background:rgba(255,255,255,0.05);border:1px solid transparent;
  color:var(--text);font-size:15px;outline:none;resize:none;
  max-height:120px;min-height:40px;line-height:1.35}
#msgInput::placeholder{color:var(--dim)}
#msgInput:focus{background:rgba(255,255,255,0.08);border-color:rgba(42,171,238,0.35)}
#sendBtn{width:40px;height:40px;border-radius:50%;border:none;
  background:var(--accent);color:#fff;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px}
#sendBtn:disabled{opacity:.35;cursor:not-allowed}

/* CALL SCREEN */
#callScreen{position:fixed;inset:0;z-index:400;display:none;background:#000;
  flex-direction:column;overflow:hidden}
#callScreen.on{display:flex}
#remoteVideo{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;background:#000;z-index:1}
#localVideo{position:absolute;width:110px;height:150px;
  top:calc(20px + env(safe-area-inset-top));right:16px;
  border-radius:12px;object-fit:cover;z-index:2;
  border:2px solid rgba(255,255,255,0.2)}
#callTop{position:absolute;top:0;left:0;right:0;padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top));z-index:3;
  background:linear-gradient(180deg,rgba(0,0,0,0.85),transparent)}
#callName{font-size:20px;font-weight:600;color:#fff;margin-bottom:4px}
#callTimer{font-size:14px;color:rgba(255,255,255,0.85);font-variant-numeric:tabular-nums}
#callBottom{position:absolute;bottom:0;left:0;right:0;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));z-index:3;
  display:flex;justify-content:center;gap:14px;
  background:linear-gradient(0deg,rgba(0,0,0,0.9),transparent)}
.cBtn{width:58px;height:58px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.18);backdrop-filter:blur(20px);
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:24px;transition:.15s;border:1px solid rgba(255,255,255,0.15)}
.cBtn.off{background:#fff;color:#000;border-color:#fff}
.cBtn.end{background:var(--red);border-color:var(--red);width:66px;height:66px;font-size:26px}

/* INCOMING CALL */
#incomingCall{position:fixed;inset:0;z-index:500;display:none;
  background:linear-gradient(180deg,#1a1f30,#0e1621);
  flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center}
#incomingCall.on{display:flex}
.icAvatar{width:120px;height:120px;border-radius:50%;
  background:linear-gradient(135deg,#2aabee,#239be0);
  display:flex;align-items:center;justify-content:center;
  font-size:48px;font-weight:900;color:#fff;margin-bottom:20px;
  animation:ringing 1s ease-in-out infinite}
@keyframes ringing{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.icName{font-size:22px;font-weight:800;margin-bottom:8px;color:#fff}
.icType{font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:40px}
.icBtns{display:flex;gap:30px}
.icBtn{width:70px;height:70px;border-radius:50%;border:none;cursor:pointer;
  font-size:28px;display:flex;align-items:center;justify-content:center;
  transition:.15s}
.icBtn.decline{background:var(--red);color:#fff}
.icBtn.accept{background:var(--green);color:#fff;animation:shake 1s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* MODAL */
.modal{position:fixed;inset:0;z-index:200;display:none;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modalCard{background:var(--elev);border-radius:16px;padding:24px;
  max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.6);
  position:relative;max-height:88vh;overflow-y:auto}
.modalCard h2{font-size:19px;margin-bottom:8px;font-weight:700}
.modalCard .desc{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.4}
.modalCard label{display:block;font-size:12px;color:var(--muted);
  margin:14px 0 6px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.modalCard input{width:100%;padding:11px 14px;border-radius:10px;
  background:rgba(255,255,255,0.05);border:1px solid transparent;
  color:var(--text);font-size:15px;outline:none}
.modalCard input:focus{background:rgba(255,255,255,0.08);
  border-color:rgba(42,171,238,0.4)}
.modalCard input.codeInput{font-family:'SF Mono',Menlo,Consolas,monospace;
  letter-spacing:.1em;text-align:center;font-size:16px}
.modalBtns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:11px;border-radius:10px;border:none;
  font-size:14px;font-weight:600;cursor:pointer}
.btnPrimary{background:var(--accent);color:#fff}
.btnSecondary{background:rgba(255,255,255,0.06);color:var(--text)}
.xBtn{position:absolute;top:14px;right:14px;width:32px;height:32px;
  border-radius:50%;border:none;background:rgba(255,255,255,0.06);
  color:var(--muted);cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center}

#toast{position:fixed;top:calc(70px + env(safe-area-inset-top));
  left:50%;transform:translateX(-50%) translateY(-100px);
  padding:11px 20px;border-radius:10px;background:rgba(79,209,165,0.95);
  color:#0e1621;font-weight:600;font-size:13.5px;
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
  transition:transform .3s;z-index:600;pointer-events:none;
  max-width:calc(100vw - 32px);text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{background:rgba(239,92,92,0.95);color:#fff}

@media (max-width:768px){
  #app{grid-template-columns:1fr}
  #sidebar.hide{display:none}
  #main{position:absolute;inset:0;z-index:10;display:none}
  #main.show{display:flex}
  #backBtn{display:flex}
  .msgWrap{max-width:82%}
  #localVideo{width:90px;height:120px;right:12px}
  #shareBanner .sbCode{flex-direction:column}
  #shareBanner .sbCopy{width:100%}
}
</style>
</head>
<body>

<div id="app">
  <div id="offlineBar">📴 Нет интернета</div>
  <aside id="sidebar">
    <div id="sbHead">
      <div id="logo">Нормикс</div>
      <button class="ib" id="newChatBtn" title="Создать чат">＋</button>
      <button class="ib" id="joinChatBtn" title="Войти по коду">🔗</button>
      <button class="ib" id="profileBtn" title="Профиль">👤</button>
    </div>
    <div id="search"><input id="searchInput" placeholder="Поиск" autocomplete="off"></div>
    <div id="chatsList"></div>
  </aside>

  <main id="main">
    <div id="emptyState">
      <div class="emIcon">💬</div>
      <div class="emTitle">Выберите чат</div>
      <div class="emText">или создайте новый кнопкой +</div>
    </div>

    <div id="chatView">
      <div id="chatHead">
        <button id="backBtn">←</button>
        <div class="avatar" id="chatAvatar" style="width:42px;height:42px;font-size:16px">?</div>
        <div id="chatHeadInfo">
          <div id="chatHeadName">—</div>
          <div id="chatHeadStatus">в сети</div>
        </div>
        <button class="ib" id="voiceCallBtn" title="Аудиозвонок">📞</button>
        <button class="ib" id="videoCallBtn" title="Видеозвонок">📹</button>
        <button class="ib" id="shareBtn" title="Код чата">🔗</button>
      </div>

      <div id="shareBanner">
        <div class="sbTitle">Код для друга</div>
        <div class="sbCode">
          <div class="sbCodeText" id="shareCode">—</div>
          <button class="sbCopy" id="copyCodeBtn">Копировать</button>
        </div>
      </div>

      <div id="messages"><div id="messagesEmpty">Начните разговор первым</div></div>
      <div class="typing" id="typingIndicator"></div>
      <div id="inputWrap">
        <div id="inputRow">
          <textarea id="msgInput" placeholder="Сообщение" rows="1"></textarea>
          <button id="sendBtn" disabled>➤</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- CALL -->
<div id="callScreen">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div id="callTop">
    <div id="callName">—</div>
    <div id="callTimer">00:00</div>
  </div>
  <div id="callBottom">
    <button class="cBtn" id="muteBtn">🎤</button>
    <button class="cBtn" id="camBtn">📹</button>
    <button class="cBtn end" id="hangupBtn">📵</button>
  </div>
</div>

<!-- INCOMING -->
<div id="incomingCall">
  <div class="icAvatar" id="icAvatar">?</div>
  <div class="icName" id="icName">—</div>
  <div class="icType" id="icType">Входящий звонок</div>
  <div class="icBtns">
    <button class="icBtn decline" id="icDecline">📵</button>
    <button class="icBtn accept" id="icAccept">📞</button>
  </div>
</div>

<!-- NEW CHAT -->
<div class="modal" id="newChatModal">
  <div class="modalCard">
    <button class="xBtn" data-close="newChatModal">✕</button>
    <h2>Новый чат</h2>
    <div class="desc">Создайте чат — получите код, отправьте другу.</div>
    <label>Имя друга</label>
    <input id="newChatName" maxlength="30" placeholder="Введите имя" autocomplete="off">
    <div class="modalBtns">
      <button class="btn btnSecondary" data-close="newChatModal">Отмена</button>
      <button class="btn btnPrimary" id="createChatBtn">Создать</button>
    </div>
  </div>
</div>

<!-- JOIN -->
<div class="modal" id="joinChatModal">
  <div class="modalCard">
    <button class="xBtn" data-close="joinChatModal">✕</button>
    <h2>Войти по коду</h2>
    <div class="desc">Вставьте код, который прислал друг.</div>
    <label>Код чата</label>
    <input id="joinCode" maxlength="30" placeholder="nx..." autocomplete="off" class="codeInput">
    <label>Ваше имя</label>
    <input id="joinName" maxlength="30" placeholder="Как вас зовут" autocomplete="off">
    <div class="modalBtns">
      <button class="btn btnSecondary" data-close="joinChatModal">Отмена</button>
      <button class="btn btnPrimary" id="joinBtn">Войти</button>
    </div>
  </div>
</div>

<!-- PROFILE -->
<div class="modal" id="profileModal">
  <div class="modalCard">
    <button class="xBtn" data-close="profileModal">✕</button>
    <h2>Профиль</h2>
    <label>Ваше имя</label>
    <input id="myNameInput" maxlength="30" placeholder="Введите имя" autocomplete="off">
    <div class="modalBtns">
      <button class="btn btnPrimary" id="saveNameBtn">Сохранить</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
(function(){

// ═══════════════════════════════════════════════════
// КОНСТАНТЫ
// ═══════════════════════════════════════════════════
const NT = 'https://ntfy.sh';
const STORAGE_KEY = 'normix_v4_chats';
const NAME_KEY = 'normix_v4_name';
const ID_KEY = 'normix_v4_sender_id';
const ACTIVE_KEY = 'normix_v4_active';
const AI_KEY = 'normix_v4_ai_chat';

const MY_ID = (function(){
  let id = localStorage.getItem(ID_KEY);
  if (!id){
    id = 'u' + Math.random().toString(36).slice(2, 11);
    localStorage.setItem(ID_KEY, id);
  }
  return id;
})();

let myName = localStorage.getItem(NAME_KEY) || 'Гость';

let chats = (function(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
})();

// AI chat
let aiChatId = localStorage.getItem(AI_KEY);

let activeChatId = null;
let currentES = null;
let typingTimeout = null;

// Call state
let call = {
  pc: null,
  stream: null,
  peer: null,
  peerName: '',
  active: false,
  incoming: null,
  pendingIce: [],
  startedAt: 0,
  timer: null,
  isVideo: false,
  chatId: null
};

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
const $ = id => document.getElementById(id);

function esc(s){
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function fmtTime(ts){
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()){
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' });
}

function genChatId(){
  return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function genRoomCode(){
  const chars = 'abcdefghijkmnpqrstuvwxyz23456789';
  let code = 'nx';
  for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function toast(text, err){
  const el = $('toast');
  el.textContent = text;
  el.className = 'on' + (err ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.className = '', 2400);
}

function saveChats(){
  try {
    const toSave = chats.map(c => ({
      id: c.id, name: c.name, room: c.room, isAI: c.isAI || false,
      unread: c.unread || 0, messages: (c.messages || []).slice(-100)
    }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch(e){}
}

// ═══════════════════════════════════════════════════
// NTFY — отправка и приём
// ═══════════════════════════════════════════════════
async function ntfySend(room, payload){
  const url = `${NT}/${encodeURIComponent(room)}`;
  const res = await fetch(url, {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
}

async function ntfyHistory(room){
  try {
    const url = `${NT}/${encodeURIComponent(room)}/json?poll=1&since=12h`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const text = await res.text();
    const lines = text.split('\n').filter(l => l.trim());
    const result = [];
    for (const line of lines){
      try {
        const env = JSON.parse(line);
        if (env.event === 'message' && env.message){
          const msg = JSON.parse(env.message);
          if (msg && msg.ts) result.push(msg);
        }
      } catch(e){}
    }
    const seen = new Set();
    const uniq = [];
    for (const m of result){
      const key = (m.from || '') + '_' + m.ts + '_' + (m.text || m.type || '');
      if (!seen.has(key)){ seen.add(key); uniq.push(m); }
    }
    uniq.sort((a,b) => a.ts - b.ts);
    return uniq;
  } catch(e){ return []; }
}

function ntfySubscribe(room, onMessage){
  if (currentES){ currentES.close(); currentES = null; }
  const url = `${NT}/${encodeURIComponent(room)}/sse`;
  const es = new EventSource(url);
  es.onmessage = (e) => {
    try {
      const env = JSON.parse(e.data);
      if (env.event === 'message' && env.message){
        const msg = JSON.parse(env.message);
        if (msg && msg.ts) onMessage(msg);
      }
    } catch(err){}
  };
  currentES = es;
  return es;
}

// ═══════════════════════════════════════════════════
// УПРАВЛЕНИЕ ЧАТАМИ
// ═══════════════════════════════════════════════════
function createChat(name){
  const chat = {
    id: genChatId(), name: name.trim(), room: genRoomCode(),
    messages: [], unread: 0, created: Date.now()
  };
  chats.unshift(chat);
  saveChats();
  return chat;
}

function ensureAIChat(){
  let ai = chats.find(c => c.isAI);
  if (!ai){
    ai = {
      id: 'ai_' + genChatId(),
      name: '🤖 Нормикс ИИ',
      isAI: true,
      messages: [],
      unread: 0,
      created: Date.now()
    };
    chats.unshift(ai);
    saveChats();
  }
  aiChatId = ai.id;
  localStorage.setItem(AI_KEY, ai.id);
  return ai;
}

function joinChatByCode(name, code){
  code = code.trim().toLowerCase();
  if (!code.startsWith('nx')) code = 'nx' + code.replace(/^nx/, '');
  const existing = chats.find(c => c.room === code && !c.isAI);
  if (existing){
    existing.name = name.trim();
    saveChats();
    return existing;
  }
  const chat = {
    id: genChatId(), name: name.trim(), room: code,
    messages: [], unread: 0, created: Date.now()
  };
  chats.unshift(chat);
  saveChats();
  return chat;
}

function getChat(id){ return chats.find(c => c.id === id); }

// ═══════════════════════════════════════════════════
// РЕНДЕР СПИСКА
// ═══════════════════════════════════════════════════
function renderChats(){
  const search = $('searchInput').value.trim().toLowerCase();
  const list = $('chatsList');
  const filtered = chats.filter(c => c.name.toLowerCase().includes(search));

  if (!filtered.length){
    list.innerHTML = `<div style="padding:60px 24px;text-align:center;color:var(--dim);font-size:14px;line-height:1.6">
      ${search ? 'Ничего не найдено' : 'Нет чатов<br><br>+ создать · 🔗 войти по коду'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(c => {
    const msgs = c.messages || [];
    const last = msgs[msgs.length - 1];
    let preview = c.isAI ? 'Спросите что-нибудь' : 'Нет сообщений';
    if (last) preview = (last.own ? 'Вы: ' : '') + last.text;
    const time = last ? fmtTime(last.ts) : '';
    const active = c.id === activeChatId ? 'active' : '';
    const initial = (c.name || '?')[0].toUpperCase();
    const isAI = c.isAI;

    return `<button class="chatItem ${active}" data-id="${c.id}">
      <div class="avatar ${isAI?'ai':'online'}">${isAI?'🤖':esc(initial)}</div>
      <div class="chatInfo">
        <div class="chatTop">
          <div class="chatName">${esc(c.name)}</div>
          <div class="chatTime">${time}</div>
        </div>
        <div class="chatBottom">
          <div class="chatPreview">${esc(preview.slice(0, 40))}</div>
          ${c.unread > 0 ? `<div class="badge">${c.unread > 99 ? '99+' : c.unread}</div>` : ''}
        </div>
      </div>
    </button>`;
  }).join('');

  list.querySelectorAll('.chatItem').forEach(btn => {
    btn.onclick = () => openChat(btn.dataset.id);
  });
}

// ═══════════════════════════════════════════════════
// ОТКРЫТИЕ ЧАТА
// ═══════════════════════════════════════════════════
async function openChat(id){
  const chat = getChat(id);
  if (!chat) return;

  activeChatId = id;
  chat.unread = 0;
  saveChats();
  localStorage.setItem(ACTIVE_KEY, id);

  $('emptyState').style.display = 'none';
  $('chatView').classList.add('on');
  $('main').classList.add('show');
  if (window.innerWidth <= 768) $('sidebar').classList.add('hide');

  $('chatHeadName').textContent = chat.name;
  $('chatAvatar').textContent = chat.isAI ? '🤖' : (chat.name || '?')[0].toUpperCase();
  $('chatAvatar').className = 'avatar' + (chat.isAI ? ' ai' : ' online');
  $('chatHeadStatus').textContent = chat.isAI ? 'онлайн всегда' : 'подключение...';

  // Hide call buttons for AI
  $('voiceCallBtn').style.display = chat.isAI ? 'none' : 'flex';
  $('videoCallBtn').style.display = chat.isAI ? 'none' : 'flex';
  $('shareBtn').style.display = chat.isAI ? 'none' : 'flex';

  if (chat.isAI){
    $('shareBanner').classList.remove('on');
    renderMessages(chat);
    renderChats();
    setTimeout(() => $('msgInput').focus(), 100);
    return;
  }

  $('shareCode').textContent = chat.room;
  if (!chat.messages || chat.messages.length === 0){
    $('shareBanner').classList.add('on');
  } else {
    $('shareBanner').classList.remove('on');
  }

  renderMessages(chat);
  renderChats();

  try {
    const history = await ntfyHistory(chat.room);
    for (const h of history){
      // Skip call signals in history view
      if (h.type && h.type.startsWith('call-')) continue;
      if (!h.text) continue;
      if (!chat.messages.find(m => m.ts === h.ts && m.from === h.from)){
        chat.messages.push({ ...h, own: h.from === MY_ID });
      }
    }
    chat.messages.sort((a, b) => a.ts - b.ts);
    saveChats();
    renderMessages(chat);

    ntfySubscribe(chat.room, (msg) => {
      handleIncoming(chat, msg);
    });
    $('chatHeadStatus').textContent = 'В сети';
  } catch(e){
    $('chatHeadStatus').textContent = 'Нет подключения';
  }

  setTimeout(() => $('msgInput').focus(), 100);
}

function handleIncoming(chat, msg){
  // Call signals
  if (msg.type && msg.type.startsWith('call-')){
    handleCallSignal(chat, msg);
    return;
  }

  if (msg.from === MY_ID) return;
  if (chat.messages.find(m => m.ts === msg.ts && m.from === msg.from)) return;
  if (!msg.text) return;

  const newMsg = {
    from: msg.from,
    sender: msg.sender || 'Гость',
    text: msg.text,
    ts: msg.ts,
    own: false
  };
  chat.messages.push(newMsg);

  if (activeChatId === chat.id){
    appendMessage(chat, newMsg);
    scrollBottom();
  } else {
    chat.unread = (chat.unread || 0) + 1;
  }

  saveChats();
  renderChats();
}

// ═══════════════════════════════════════════════════
// РЕНДЕР СООБЩЕНИЙ
// ═══════════════════════════════════════════════════
function renderMessages(chat){
  const box = $('messages');
  box.innerHTML = '';

  if (!chat.messages || chat.messages.length === 0){
    const empty = document.createElement('div');
    empty.id = 'messagesEmpty';
    empty.textContent = chat.isAI ? 'Спросите что-нибудь у ИИ' : 'Начните разговор первым';
    box.appendChild(empty);
    return;
  }

  let lastDate = '';
  let lastFrom = '';

  for (const m of chat.messages){
    const d = new Date(m.ts);
    const dateKey = d.toDateString();

    if (dateKey !== lastDate){
      const today = new Date().toDateString();
      const yest = new Date(Date.now() - 86400000).toDateString();
      let dateText;
      if (dateKey === today) dateText = 'Сегодня';
      else if (dateKey === yest) dateText = 'Вчера';
      else dateText = d.toLocaleDateString('ru-RU', { day:'2-digit', month:'long' });
      const sep = document.createElement('div');
      sep.className = 'dateSep';
      sep.textContent = dateText;
      box.appendChild(sep);
      lastDate = dateKey;
      lastFrom = '';
    }

    const wrap = document.createElement('div');
    const own = m.own;
    const cls = own ? 'own' : 'other';
    const first = lastFrom !== cls ? 'first' : '';
    wrap.className = `msgWrap ${cls} ${first}`;
    const time = fmtTime(m.ts);
    const senderName = !own && m.sender && !chat.isAI ? `<div class="msgSender">${esc(m.sender)}</div>` : '';
    wrap.innerHTML = `<div class="msg">${senderName}<div class="msgText">${esc(m.text)}</div><span class="msgMeta">${time}</span></div>`;
    box.appendChild(wrap);
    lastFrom = cls;
  }
  scrollBottom();
}

function appendMessage(chat, msg){
  const box = $('messages');
  const empty = box.querySelector('#messagesEmpty');
  if (empty) empty.remove();

  const wrap = document.createElement('div');
  const cls = msg.own ? 'own' : 'other';
  wrap.className = `msgWrap ${cls} first`;
  const time = fmtTime(msg.ts);
  const senderName = !msg.own && msg.sender && !chat.isAI ? `<div class="msgSender">${esc(msg.sender)}</div>` : '';
  wrap.innerHTML = `<div class="msg">${senderName}<div class="msgText">${esc(msg.text)}</div><span class="msgMeta">${time}</span></div>`;
  box.appendChild(wrap);
}

function scrollBottom(){
  const box = $('messages');
  box.scrollTop = box.scrollHeight;
}

// ═══════════════════════════════════════════════════
// ОТПРАВКА
// ═══════════════════════════════════════════════════
async function sendMessage(){
  const input = $('msgInput');
  const text = input.value.trim();
  if (!text || !activeChatId) return;

  const chat = getChat(activeChatId);
  if (!chat) return;

  const payload = {
    from: MY_ID,
    sender: myName,
    text: text,
    ts: Date.now()
  };

  const localMsg = { ...payload, own: true };
  chat.messages.push(localMsg);
  saveChats();

  appendMessage(chat, localMsg);
  scrollBottom();

  input.value = '';
  input.style.height = 'auto';
  $('sendBtn').disabled = true;
  $('shareBanner').classList.remove('on');
  renderChats();

  if (chat.isAI){
    // AI reply
    $('typingIndicator').textContent = '🤖 печатает...';
    try {
      const reply = await askAI(text);
      chat.messages.push({
        from: 'ai',
        text: reply,
        ts: Date.now(),
        own: false
      });
      saveChats();
      appendMessage(chat, chat.messages[chat.messages.length - 1]);
      scrollBottom();
      renderChats();
    } catch(e){
      toast('ИИ не ответил', true);
    }
    $('typingIndicator').textContent = '';
    return;
  }

  try {
    await ntfySend(chat.room, payload);
  } catch(e){
    toast('Не отправлено. Проверьте интернет.', true);
  }
}

// ИИ — POLLINATIONS (бесплатно, без ключа)
// ═══════════════════════════════════════════════════
async function askAI(text){
  const system = 'Ты дружелюбный собеседник в мессенджере Нормикс. Отвечай кратко, по-русски, по делу. Не используй markdown.';
  try {
    const url = `https://text.pollinations.ai/${encodeURIComponent(text)}?system=${encodeURIComponent(system)}&model=openai`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let reply = (await res.text()).trim();
    if (!reply) reply = 'Не могу ответить. Попробуйте ещё.';
    // Ограничим длину
    if (reply.length > 500) reply = reply.slice(0, 500) + '...';
    return reply;
  } catch(e){
    return 'Ошибка ИИ. Проверьте интернет.';
  }
}

// ═══════════════════════════════════════════════════
// ЗВОНКИ — WebRTC через ntfy signaling
// ═══════════════════════════════════════════════════
const ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:global.stun.twilio.com:3478' }
  ]
};

async function startCall(isVideo){
  if (call.active) return;
  if (!activeChatId) return;
  const chat = getChat(activeChatId);
  if (!chat || chat.isAI){
    toast('Звонки только в обычных чатах', true);
    return;
  }

  call.active = true;
  call.isVideo = isVideo;
  call.chatId = chat.id;
  call.peerName = chat.name;
  call.startedAt = Date.now();
  call.pendingIce = [];

  showCallScreen(chat.name, isVideo);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: isVideo ? { width: 640, height: 480, facingMode: 'user' } : false
    });
    call.stream = stream;
    if (isVideo){
      $('localVideo').srcObject = stream;
      $('localVideo').style.display = 'block';
      $('localVideo').play().catch(()=>{});
    } else {
      $('localVideo').style.display = 'none';
    }

    const pc = new RTCPeerConnection(ICE_CONFIG);
    call.pc = pc;

    stream.getTracks().forEach(t => pc.addTrack(t, stream));

    pc.onicecandidate = e => {
      if (e.candidate){
        ntfySend(chat.room, {
          type: 'call-ice',
          from: MY_ID,
          candidate: e.candidate.toJSON(),
          ts: Date.now()
        }).catch(()=>{});
      }
    };

    pc.ontrack = e => {
      $('remoteVideo').srcObject = e.streams[0];
      $('remoteVideo').play().catch(()=>{});
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected'){
        endCall();
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await ntfySend(chat.room, {
      type: 'call-offer',
      from: MY_ID,
      sender: myName,
      sdp: offer.sdp,
      video: isVideo,
      ts: Date.now()
    });

    startCallTimer();
    toast(isVideo ? '📹 Видеозвонок...' : '📞 Звонок...');
  } catch(e){
    console.error('Call error:', e);
    toast('Нет доступа к камере/микрофону', true);
    endCall();
  }
}

function showCallScreen(peerName, isVideo){
  $('callName').textContent = peerName;
  $('callTimer').textContent = '00:00';
  $('camBtn').style.display = isVideo ? 'flex' : 'none';
  $('muteBtn').classList.remove('off');
  $('camBtn').classList.remove('off');
  $('callScreen').classList.add('on');
}

function startCallTimer(){
  clearInterval(call.timer);
  call.timer = setInterval(() => {
    const el = Math.floor((Date.now() - call.startedAt) / 1000);
    $('callTimer').textContent =
      String(Math.floor(el / 60)).padStart(2,'0') + ':' + String(el % 60).padStart(2,'0');
  }, 1000);
}

async function handleCallSignal(chat, msg){
  if (msg.from === MY_ID) return;

  try {
    if (msg.type === 'call-offer'){
      // Incoming call
      if (call.active){
        // Busy
        ntfySend(chat.room, { type: 'call-end', from: MY_ID, ts: Date.now() }).catch(()=>{});
        return;
      }
      call.incoming = {
        chatId: chat.id,
        room: chat.room,
        from: msg.from,
        sender: msg.sender || 'Собеседник',
        sdp: msg.sdp,
        video: !!msg.video
      };
      showIncomingCall(msg.sender || 'Собеседник', !!msg.video);
    }

    if (msg.type === 'call-answer' && call.pc && call.active){
      await call.pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
      // Add pending ICE
      for (const c of call.pendingIce){
        await call.pc.addIceCandidate(c).catch(()=>{});
      }
      call.pendingIce = [];
    }

    if (msg.type === 'call-ice' && call.active){
      if (call.pc && call.pc.remoteDescription){
        await call.pc.addIceCandidate(msg.candidate).catch(()=>{});
      } else {
        call.pendingIce.push(msg.candidate);
      }
    }

    if (msg.type === 'call-end'){
      if (call.active) endCall();
      if (call.incoming) cancelIncomingCall();
    }

    if (msg.type === 'call-reject'){
      toast('Звонок отклонён');
      if (call.active) endCall();
    }
  } catch(e){
    console.error('Signal error:', e);
  }
}

function showIncomingCall(name, isVideo){
  $('icAvatar').textContent = (name || '?')[0].toUpperCase();
  $('icName').textContent = name;
  $('icType').textContent = isVideo ? 'Входящий видеозвонок' : 'Входящий звонок';
  $('incomingCall').classList.add('on');
  playRingtone();
}

function cancelIncomingCall(){
  call.incoming = null;
  $('incomingCall').classList.remove('on');
  stopRingtone();
}

async function acceptCall(){
  if (!call.incoming) return;
  const inc = call.incoming;
  cancelIncomingCall();

  call.active = true;
  call.isVideo = inc.video;
  call.chatId = inc.chatId;
  call.peerName = inc.sender;
  call.startedAt = Date.now();
  call.pendingIce = [];

  showCallScreen(inc.sender, inc.video);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: inc.video ? { width: 640, height: 480, facingMode: 'user' } : false
    });
    call.stream = stream;
    if (inc.video){
      $('localVideo').srcObject = stream;
      $('localVideo').style.display = 'block';
      $('localVideo').play().catch(()=>{});
    }

    const pc = new RTCPeerConnection(ICE_CONFIG);
    call.pc = pc;
    stream.getTracks().forEach(t => pc.addTrack(t, stream));

    pc.onicecandidate = e => {
      if (e.candidate){
        ntfySend(inc.room, {
          type: 'call-ice', from: MY_ID,
          candidate: e.candidate.toJSON(), ts: Date.now()
        }).catch(()=>{});
      }
    };

    pc.ontrack = e => {
      $('remoteVideo').srcObject = e.streams[0];
      $('remoteVideo').play().catch(()=>{});
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') endCall();
    };

    await pc.setRemoteDescription({ type: 'offer', sdp: inc.sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    await ntfySend(inc.room, {
      type: 'call-answer', from: MY_ID, sdp: answer.sdp, ts: Date.now()
    });

    // Add pending ICE
    for (const c of call.pendingIce){
      await pc.addIceCandidate(c).catch(()=>{});
    }
    call.pendingIce = [];

    startCallTimer();
  } catch(e){
    console.error('Accept error:', e);
    toast('Не удалось подключиться', true);
    rejectCall();
  }
}

async function rejectCall(){
  if (!call.incoming) return;
  const inc = call.incoming;
  try {
    await ntfySend(inc.room, { type: 'call-reject', from: MY_ID, ts: Date.now() });
  } catch(e){}
  cancelIncomingCall();
}

function endCall(){
  if (call.chatId){
    const chat = getChat(call.chatId);
    if (chat && chat.room){
      ntfySend(chat.room, { type: 'call-end', from: MY_ID, ts: Date.now() }).catch(()=>{});
    }
  }

  clearInterval(call.timer);
  call.timer = null;

  if (call.pc){
    call.pc.close();
    call.pc = null;
  }

  if (call.stream){
    call.stream.getTracks().forEach(t => t.stop());
    call.stream = null;
  }

  $('localVideo').srcObject = null;
  $('remoteVideo').srcObject = null;
  $('callScreen').classList.remove('on');

  call.active = false;
  call.incoming = null;
  call.chatId = null;
}

// Ringtone
let ringCtx = null, ringTimer = null;
function playRingtone(){
  try {
    if (!ringCtx) ringCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (ringCtx.state === 'suspended') ringCtx.resume();
    function ring(){
      if (!ringCtx) return;
      const now = ringCtx.currentTime;
      [880, 660].forEach((f, i) => {
        const o = ringCtx.createOscillator();
        const g = ringCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, now + i * 0.4);
        g.gain.linearRampToValueAtTime(0.15, now + i * 0.4 + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.4 + 0.35);
        o.connect(g).connect(ringCtx.destination);
        o.start(now + i * 0.4);
        o.stop(now + i * 0.4 + 0.4);
      });
    }
    ring();
    ringTimer = setInterval(ring, 1500);
  } catch(e){}
}

function stopRingtone(){
  if (ringTimer){ clearInterval(ringTimer); ringTimer = null; }
}

// ═══════════════════════════════════════════════════
// ЗАКРЫТИЕ ЧАТА
// ═══════════════════════════════════════════════════
function closeChat(){
  activeChatId = null;
  localStorage.removeItem(ACTIVE_KEY);

  if (currentES){ currentES.close(); currentES = null; }

  $('chatView').classList.remove('on');
  $('main').classList.remove('show');
  $('emptyState').style.display = 'flex';
  $('sidebar').classList.remove('hide');
  $('shareBanner').classList.remove('on');

  renderChats();
}

// ═══════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════
const msgInput = $('msgInput');
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  $('sendBtn').disabled = !msgInput.value.trim();
});
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
$('sendBtn').onclick = sendMessage;

$('backBtn').onclick = closeChat;
$('searchInput').oninput = renderChats;

$('shareBtn').onclick = () => {
  if (!activeChatId) return;
  const chat = getChat(activeChatId);
  if (chat.isAI) return;
  $('shareCode').textContent = chat.room;
  $('shareBanner').classList.toggle('on');
};

$('copyCodeBtn').onclick = () => {
  const code = $('shareCode').textContent;
  if (navigator.clipboard){
    navigator.clipboard.writeText(code).then(() => toast('Код скопирован'))
      .catch(() => prompt('Скопируйте:', code));
  } else prompt('Скопируйте:', code);
};

// Call buttons
$('voiceCallBtn').onclick = () => startCall(false);
$('videoCallBtn').onclick = () => startCall(true);
$('hangupBtn').onclick = endCall;

$('muteBtn').onclick = () => {
  if (!call.stream) return;
  const t = call.stream.getAudioTracks()[0];
  if (t){ t.enabled = !t.enabled; $('muteBtn').classList.toggle('off', !t.enabled); }
};
$('camBtn').onclick = () => {
  if (!call.stream) return;
  const t = call.stream.getVideoTracks()[0];
  if (t){ t.enabled = !t.enabled; $('camBtn').classList.toggle('off', !t.enabled); }
};

$('icAccept').onclick = acceptCall;
$('icDecline').onclick = rejectCall;

// ═══════════════════════════════════════════════════
// NEW CHAT
// ═══════════════════════════════════════════════════
$('newChatBtn').onclick = () => {
  $('newChatName').value = '';
  $('newChatModal').classList.add('on');
  setTimeout(() => $('newChatName').focus(), 100);
};

$('createChatBtn').onclick = () => {
  const name = $('newChatName').value.trim();
  if (name.length < 2){ toast('Имя: мин. 2 символа', true); return; }
  const chat = createChat(name);
  $('newChatModal').classList.remove('on');
  renderChats();
  openChat(chat.id);
  toast('Чат создан. Отправьте код другу!');
};

// ═══════════════════════════════════════════════════
// JOIN
// ═══════════════════════════════════════════════════
$('joinChatBtn').onclick = () => {
  $('joinCode').value = '';
  $('joinName').value = myName !== 'Гость' ? myName : '';
  $('joinChatModal').classList.add('on');
  setTimeout(() => $('joinCode').focus(), 100);
};

$('joinBtn').onclick = () => {
  const code = $('joinCode').value.trim().toLowerCase();
  const name = $('joinName').value.trim();
  if (!code || code.length < 4){ toast('Введите код', true); return; }
  if (name.length < 2){ toast('Ваше имя: мин. 2', true); return; }
  myName = name;
  localStorage.setItem(NAME_KEY, myName);
  const chat = joinChatByCode(name, code);
  $('joinChatModal').classList.remove('on');
  renderChats();
  openChat(chat.id);
  toast('Подключено');
};

// ═══════════════════════════════════════════════════
// PROFILE
// ═══════════════════════════════════════════════════
$('profileBtn').onclick = () => {
  $('myNameInput').value = myName === 'Гость' ? '' : myName;
  $('profileModal').classList.add('on');
};

$('saveNameBtn').onclick = () => {
  const name = $('myNameInput').value.trim();
  if (name.length < 2){ toast('Мин. 2 символа', true); return; }
  myName = name;
  localStorage.setItem(NAME_KEY, myName);
  $('profileModal').classList.remove('on');
  toast('Сохранено');
};

// Modals
document.querySelectorAll('[data-close]').forEach(b => {
  b.onclick = () => document.getElementById(b.dataset.close).classList.remove('on');
});
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('on'); });
});

// Offline
function updateOnline(){
  $('offlineBar').classList.toggle('on', !navigator.onLine);
}
window.addEventListener('online', updateOnline);
window.addEventListener('offline', updateOnline);
updateOnline();

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    document.querySelectorAll('.modal.on').forEach(m => m.classList.remove('on'));
    if (call.active) endCall();
    if (call.incoming) rejectCall();
  }
});

// Cleanup
window.addEventListener('beforeunload', () => {
  if (call.active) endCall();
});

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
ensureAIChat();
renderChats();

const lastActive = localStorage.getItem(ACTIVE_KEY);
if (lastActive && getChat(lastActive)){
  setTimeout(() => openChat(lastActive), 300);
}

})();
</script>
</body>
</html>
